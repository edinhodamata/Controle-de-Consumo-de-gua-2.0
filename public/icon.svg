<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer meter circular ring gauge -->
  <circle cx="256" cy="270" r="150" fill="none" stroke="#334155" stroke-width="14" stroke-dasharray="14 10" opacity="0.6" />
  <circle cx="256" cy="270" r="150" fill="none" stroke="#38bdf8" stroke-width="14" stroke-dasharray="240 700" stroke-linecap="round" />

  <!-- Central Water Droplet -->
  <path d="M 256 120 C 256 120 160 250 160 316 C 160 370 203 412 256 412 C 309 412 352 370 352 316 C 352 250 256 120 256 120 Z" fill="url(#waterGrad)" filter="url(#glow)" />

  <!-- Specular inner highlight -->
  <path d="M 226 250 C 210 275 204 310 206 335 C 196 325 192 305 198 280 C 206 250 226 230 226 230 Z" fill="#ffffff" opacity="0.45" />

  <!-- Flow pulse rings -->
  <circle cx="256" cy="326" r="38" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.4" />
  <circle cx="256" cy="326" r="14" fill="#ffffff" opacity="0.8" />
</svg>
