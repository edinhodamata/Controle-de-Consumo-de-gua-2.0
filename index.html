    <script>
      (function() {
        try {
          const t = localStorage.getItem('aguacontrol_theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-sky-100 selection:text-sky-900 font-sans transition-colors">
